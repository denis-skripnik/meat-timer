plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.blinddev.cookbreathe'
    compileSdk 35

    defaultConfig {
        applicationId 'xyz.blinddev.cookbreathe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
